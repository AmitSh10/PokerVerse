[package]
name = "poker_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
poker_engine = { path = "../poker_engine" }
poker_server = { path = "../poker_server" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
